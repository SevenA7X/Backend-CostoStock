server.port=8082
server.address=0.0.0.0
spring.application.name=ms-proveedor

spring.datasource.url=jdbc:h2:mem:proveedordb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true

# Dirección de MS-Core (gestión de ofertas). Pedidos entre microservicios.
app.ms-core-url=${MS_CORE_URL:http://localhost:8080}
# Tamaño máximo de la foto ya decodificada (2 MB)
app.foto-max-bytes=2097152
