server.port=8083
server.address=0.0.0.0
spring.application.name=ms-clima

spring.datasource.url=jdbc:h2:mem:climadb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true

# API REST pública externa (sin API key)
app.open-meteo-url=${OPEN_METEO_URL:https://api.open-meteo.com}
# Minutos que se reutiliza una consulta antes de volver a llamar a Open-Meteo
app.cache-minutos=10
